version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: koillection
build:
  toolchains: []
  run_buildscript: false
images:
  - id: koillection
    target: service
    service: koillection
    source: koillection/koillection
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  - id: postgres
    target: service
    service: db
    source: library/postgres
    channel: custom
    sort: semver
    # postgres publishes two-part tags (16.15); pad to three so the version
    # line stays valid.
    tag_regex: '^16[.][0-9]+$'
    version_regex: '^(?P<version>16[.][0-9]+)$'
    version_template: '{version}.0'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Koillection
    skip_if_version_exists: true
